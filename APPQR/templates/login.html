<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - APPQR</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <div class="login-wrapper">
        <div class="login-content">
            <!-- Lado izquierdo: Formulario -->
            <div class="login-left">
                <div class="login-form-container">
                    <h1><i class="fas fa-qrcode"></i> APPQR</h1>
                    <h2>Iniciar Sesión - ADMIN</h2>
                    <form class="login-form" method="POST" action="{{ url_for('auth.login') }}">
                        <div class="input-group">
                            <span class="input-icon"><i class="fas fa-user"></i></span>
                            <input type="text" name="username" placeholder="Usuario" required>
                        </div>
                        <div class="input-group">
                            <span class="input-icon"><i class="fas fa-lock"></i></span>
                            <input type="password" name="password" placeholder="Contraseña" required>
                        </div>
                        <button type="submit">
                            <i class="fas fa-sign-in-alt"></i> Iniciar Sesión
                        </button>
                    </form>
                    {% if error %}
                    <div style="color: #dc2626; margin-top: 10px;">{{ error }}</div>
                    {% endif %}
                    <a href="{{ url_for('main.index') }}" class="back-link">
                        <i class="fas fa-arrow-left"></i> Volver al inicio
                    </a>
                </div>
            </div>

            <!-- Lado derecho: Imagen -->
            <div class="login-right">
                <div class="login-image">
                    <svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
                        <!-- Fondo con gradiente -->
                        <defs>
                            <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" style="stop-color:#e0f7fa;stop-opacity:1" />
                                <stop offset="100%" style="stop-color:#b3e5fc;stop-opacity:1" />
                            </linearGradient>
                            <linearGradient id="qrGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" style="stop-color:#01579b;stop-opacity:1" />
                                <stop offset="100%" style="stop-color:#0288d1;stop-opacity:1" />
                            </linearGradient>
                        </defs>

                        <!-- Fondo -->
                        <rect width="400" height="400" fill="url(#bgGradient)" />

                        <!-- QR Code simulado -->
                        <g transform="translate(100, 100)">
                            <!-- Marco del QR -->
                            <rect x="0" y="0" width="200" height="200" fill="white" rx="10" />
                            <rect x="10" y="10" width="180" height="180" fill="url(#qrGradient)" rx="5" />

                            <!-- Patrón QR simplificado -->
                            <rect x="20" y="20" width="30" height="30" fill="white" rx="3" />
                            <rect x="150" y="20" width="30" height="30" fill="white" rx="3" />
                            <rect x="20" y="150" width="30" height="30" fill="white" rx="3" />

                            <!-- Puntos del QR -->
                            <rect x="25" y="25" width="20" height="20" fill="url(#qrGradient)" rx="2" />
                            <rect x="155" y="25" width="20" height="20" fill="url(#qrGradient)" rx="2" />
                            <rect x="25" y="155" width="20" height="20" fill="url(#qrGradient)" rx="2" />

                            <!-- Líneas decorativas -->
                            <rect x="70" y="30" width="60" height="8" fill="white" rx="4" />
                            <rect x="70" y="50" width="40" height="8" fill="white" rx="4" />
                            <rect x="70" y="70" width="80" height="8" fill="white" rx="4" />

                            <rect x="30" y="90" width="50" height="8" fill="white" rx="4" />
                            <rect x="100" y="90" width="30" height="8" fill="white" rx="4" />
                            <rect x="150" y="90" width="20" height="8" fill="white" rx="4" />

                            <rect x="30" y="110" width="80" height="8" fill="white" rx="4" />
                            <rect x="130" y="110" width="40" height="8" fill="white" rx="4" />

                            <rect x="70" y="130" width="60" height="8" fill="white" rx="4" />
                            <rect x="150" y="130" width="20" height="8" fill="white" rx="4" />
                        </g>

                        <!-- Elementos decorativos -->
                        <circle cx="50" cy="80" r="15" fill="#0288d1" opacity="0.3" />
                        <circle cx="350" cy="120" r="20" fill="#01579b" opacity="0.2" />
                        <circle cx="80" cy="320" r="12" fill="#0288d1" opacity="0.4" />
                        <circle cx="320" cy="350" r="18" fill="#01579b" opacity="0.3" />

                        <!-- Texto decorativo -->
                        <text x="200" y="350" text-anchor="middle" fill="#01579b" font-family="Inter, sans-serif"
                            font-size="24" font-weight="600">APPQR</text>
                        <text x="200" y="370" text-anchor="middle" fill="#0288d1" font-family="Inter, sans-serif"
                            font-size="14" font-weight="400">Sistema de Códigos QR</text>
                    </svg>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
