<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}APPQR{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .navbar-custom {
            width: 100%;
            background: linear-gradient(135deg, #01579b 0%, #0277bd 100%);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 32px;
            height: 64px;
            box-shadow: 0 4px 20px rgba(1, 87, 155, 0.15), 0 2px 8px rgba(0, 0, 0, 0.1);
            position: relative;
            z-index: 1000;
        }

        .navbar-custom::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.1) 0%, rgba(255, 255, 255, 0.05) 100%);
            pointer-events: none;
        }

        .navbar-custom .nav-brand {
            font-weight: 700;
            font-size: 1.4em;
            color: #fff;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.3s ease;
            position: relative;
            z-index: 1;
        }

        .navbar-custom .nav-brand:hover {
            transform: translateY(-1px);
            text-shadow: 0 2px 8px rgba(255, 255, 255, 0.3);
        }

        .navbar-custom .nav-brand i {
            font-size: 1.3em;
            background: linear-gradient(45deg, #ffffff, #e3f2fd);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.2));
        }

        .navbar-custom .nav-menu {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .navbar-custom .nav-link {
            color: #fff;
            text-decoration: none;
            font-weight: 500;
            padding: 10px 16px;
            border-radius: 8px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .navbar-custom .nav-link::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s ease;
        }

        .navbar-custom .nav-link:hover::before {
            left: 100%;
        }

        .navbar-custom .nav-link:hover {
            background: rgba(1, 58, 99, 0.8);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(1, 87, 155, 0.3);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .navbar-custom .nav-link.active {
            background: linear-gradient(135deg, #013a63 0%, #01579b 100%);
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.2), 0 2px 8px rgba(1, 87, 155, 0.4);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .navbar-custom .nav-link i {
            margin-right: 6px;
            transition: transform 0.3s ease;
        }

        .navbar-custom .nav-link:hover i {
            transform: scale(1.1);
        }

        /* Responsive design */
        @media (max-width: 768px) {
            .navbar-custom {
                padding: 0 16px;
                height: 56px;
            }
            
            .navbar-custom .nav-brand {
                font-size: 1.2em;
            }
            
            .navbar-custom .nav-menu {
                gap: 4px;
            }
            
            .navbar-custom .nav-link {
                padding: 8px 12px;
                font-size: 0.9em;
            }
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>

<body>
    <nav class="navbar-custom">
        <a class="nav-brand" href="{{ url_for('main.index') }}"><i class="fas fa-qrcode"></i> APPQR</a>
        <div class="nav-menu">
            <a class="nav-link {% if request.endpoint == 'main.index' %}active{% endif %}"
                href="{{ url_for('main.index') }}">Inicio
            </a>
            <a class="nav-link {% if request.endpoint == 'main.qr_section' %}active{% endif %}"
                href="{{ url_for('main.qr_section') }}">Sección QR
            </a>
            {% if session.get('user_authenticated') %}
            <a class="nav-link" href="{{ url_for('auth.logout') }}"><i class="fas fa-sign-out-alt"></i> Cerrar
                sesión</a>
            {% endif %}
        </div>
    </nav>
    {% block content %}{% endblock %}
    {% block extra_scripts %}{% endblock %}
</body>

</html>
